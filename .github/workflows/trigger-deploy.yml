# Pushing here must make the change live.
#
# The production deploy lives in CanteenX/Gym-frontend, because that project owns
# the domain and its workflow is the one that assembles the admin SPA into the
# deployment. Without this, an admin-panel change sat unreleased until something
# unrelated happened to land on Gym-Server.
#
# This sends the pushed SHA, so the deploy builds exactly this commit rather
# than whatever main has become by the time it runs.

name: Trigger deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue rather than cancel: each push should reach production.
concurrency:
  group: trigger-deploy
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Gym-frontend to deploy this commit
        env:
          # GITHUB_TOKEN cannot reach another repository, so this needs a PAT
          # with access to CanteenX/Gym-Server.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # jq --arg keeps the SHA out of the shell's parsing entirely.
          jq -n --arg sha "$SHA" \
            '{event_type:"deploy", client_payload:{admin_ref:$sha, source:"Gym-Admin"}}' \
            | gh api repos/CanteenX/Gym-frontend/dispatches --input -
          echo "Dispatched deploy for Gym-Admin@$SHA"
          echo "Watch: https://github.com/CanteenX/Gym-frontend/actions" >> "$GITHUB_STEP_SUMMARY"
